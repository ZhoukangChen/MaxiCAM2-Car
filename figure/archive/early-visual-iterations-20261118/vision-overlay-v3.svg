<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">按底图黑线中心自动对齐的识别叠加</title>
  <desc id="desc">绿色点线取自模拟底图黑色路线的像素中心；两条青色边界由同一条中心轨迹按车宽比例生成；红框标记障碍物。</desc>
