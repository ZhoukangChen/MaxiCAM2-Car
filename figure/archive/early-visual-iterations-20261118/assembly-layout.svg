<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">循迹避障小车装配布局参考</title>
  <desc id="desc">自制两轮差速小车俯视布局参考，标出 MaixCAM2、SEN0628、YB-MUX04-2.0、NUCLEO-F446RE、Gravity IO、AT8236、MP2491C、3S 6000mAh 电池、编码电机和车轮。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101a29"/><stop offset="1" stop-color="#1a2b40"/></linearGradient>
    <linearGradient id="deck" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#2b3e53"/><stop offset="1" stop-color="#172638"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#02070d" flood-opacity=".35"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .white{fill:#f1f6ff}.muted{fill:#9eafc5}.small{font-size:13px}.label{font-size:15px;font-weight:700}
      .board{fill:#f2f5f7;stroke:#9dafbd;stroke-width:2}.trace{stroke:#b3c0ca;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="758" rx="23" fill="none" stroke="#5c7593" stroke-opacity=".34"/>
  <text x="38" y="48" class="white" font-size="22" font-weight="800">装配布局参考 · 俯视图</text>
  <text x="38" y="74" class="muted small">前进方向朝上 · 3S 6000mAh 电池居中低置 · 八路循线模块靠近车头</text>
  <g transform="translate(40 18)">
    <!-- 车架目标外形 -->
    <g filter="url(#shadow)">
      <rect x="300" y="95" width="320" height="565" rx="58" fill="url(#deck)" stroke="#60778e" stroke-width="4"/>
      <path d="M319 157h282M319 590h282" stroke="#445b73" stroke-width="2" stroke-dasharray="7 8"/>
    </g>
    <text x="460" y="119" text-anchor="middle" fill="#8ce3c5" font-size="12" font-weight="800">FRONT / 前进方向</text>
    <path d="M460 128v25m-8-9 8 9 8-9" fill="none" stroke="#8ce3c5" stroke-width="3"/>

    <!-- 左右车轮与电机 -->
    <rect x="260" y="382" width="40" height="150" rx="18" fill="#090e14" stroke="#52677c" stroke-width="3"/>
    <path d="M268 398h24m-24 18h24m-24 18h24m-24 18h24m-24 18h24m-24 18h24m-24 18h24" stroke="#283542" stroke-width="4"/>
    <rect x="620" y="382" width="40" height="150" rx="18" fill="#090e14" stroke="#52677c" stroke-width="3"/>
    <path d="M628 398h24m-24 18h24m-24 18h24m-24 18h24m-24 18h24m-24 18h24m-24 18h24" stroke="#283542" stroke-width="4"/>
    <rect x="302" y="411" width="88" height="60" rx="11" fill="#d6a64a" stroke="#f4d28a" stroke-width="2"/>
    <rect x="530" y="411" width="88" height="60" rx="11" fill="#d6a64a" stroke="#f4d28a" stroke-width="2"/>
    <text x="346" y="447" text-anchor="middle" fill="#302106" font-size="10" font-weight="800">左编码电机</text>
    <text x="574" y="447" text-anchor="middle" fill="#302106" font-size="10" font-weight="800">右编码电机</text>
    <path d="M302 441h-2M618 441h2" stroke="#e7b85d" stroke-width="7"/>

    <!-- 摄像头和传感器 -->
    <rect x="395" y="151" width="130" height="74" rx="13" fill="#111820" stroke="#64d5e8" stroke-width="3"/>
    <circle cx="460" cy="188" r="19" fill="#0a111a" stroke="#8ce3f0" stroke-width="4"/>
    <circle cx="460" cy="188" r="7" fill="#284e62"/>
    <text x="460" y="242" text-anchor="middle" class="white" font-size="12" font-weight="700">MaixCAM2 + OS04D10</text>
    <rect x="427" y="267" width="66" height="40" rx="9" fill="#274e58" stroke="#70e1e8" stroke-width="2"/>
    <text x="460" y="292" text-anchor="middle" fill="#d9ffff" font-size="11" font-weight="700">SEN0628</text>
    <rect x="310" y="323" width="300" height="20" rx="6" fill="#111b25" stroke="#63e6be" stroke-width="2"/>
    <g fill="#63e6be"><circle cx="320" cy="333" r="3"/><circle cx="340" cy="333" r="3"/><circle cx="360" cy="333" r="3"/><circle cx="380" cy="333" r="3"/><circle cx="400" cy="333" r="3"/><circle cx="420" cy="333" r="3"/><circle cx="440" cy="333" r="3"/><circle cx="460" cy="333" r="3"/><circle cx="480" cy="333" r="3"/><circle cx="500" cy="333" r="3"/><circle cx="520" cy="333" r="3"/><circle cx="540" cy="333" r="3"/><circle cx="560" cy="333" r="3"/><circle cx="580" cy="333" r="3"/><circle cx="600" cy="333" r="3"/></g>
    <text x="460" y="365" text-anchor="middle" class="white" font-size="12" font-weight="700">YB-MUX04-2.0 · 初始距地约 5–10 mm</text>

    <!-- 控制板、IO、驱动和电池 -->
    <rect x="322" y="476" width="155" height="98" rx="10" class="board"/>
    <rect x="334" y="490" width="131" height="70" rx="6" fill="#e3eaf0" stroke="#b3c0ca"/>
    <text x="399" y="526" text-anchor="middle" class="dark" font-size="11" font-weight="800">NUCLEO-F446RE</text>
    <text x="399" y="547" text-anchor="middle" fill="#526576" font-size="9">实时控制 / 编码器</text>
    <rect x="486" y="475" width="124" height="91" rx="10" fill="#182229" stroke="#63e6be" stroke-width="2"/>
    <g fill="#d5a83f"><circle cx="498" cy="490" r="3"/><circle cx="512" cy="490" r="3"/><circle cx="526" cy="490" r="3"/><circle cx="540" cy="490" r="3"/><circle cx="554" cy="490" r="3"/><circle cx="568" cy="490" r="3"/><circle cx="582" cy="490" r="3"/><circle cx="596" cy="490" r="3"/></g>
    <text x="548" y="524" text-anchor="middle" class="white" font-size="10" font-weight="700">Gravity IO</text>
    <text x="548" y="544" text-anchor="middle" class="muted" font-size="8">传感器接线扩展</text>
    <rect x="485" y="588" width="99" height="34" rx="8" fill="#b96c48" stroke="#ffd2b1" stroke-width="2"/>
    <text x="534" y="610" text-anchor="middle" fill="#fff4ec" font-size="9" font-weight="800">AT8236</text>
    <rect x="326" y="585" width="143" height="38" rx="9" fill="#19222d" stroke="#ff7777" stroke-width="2"/>
    <text x="397" y="609" text-anchor="middle" fill="#ffdada" font-size="10" font-weight="800">3S 6000mAh · 低位固定</text>
    <rect x="591" y="580" width="61" height="45" rx="8" fill="#25364a" stroke="#ffc857" stroke-width="2"/>
    <text x="621" y="598" text-anchor="middle" fill="#ffe8af" font-size="8" font-weight="700">MP2491C</text>
    <text x="621" y="613" text-anchor="middle" fill="#ffe8af" font-size="7">7.5/5/3.3V</text>

    <!-- 三点支撑示意 -->
    <circle cx="460" cy="648" r="19" fill="#9cacbb" stroke="#e8eff5" stroke-width="3"/>
    <circle cx="460" cy="648" r="7" fill="#526576"/>
    <text x="460" y="690" text-anchor="middle" class="muted" font-size="11">后部万向球轮 · 实际位置按重心调整</text>

    <!-- 尺寸界限 -->
    <path d="M260 703H660" stroke="#91a4bb" stroke-width="1.5"/>
    <path d="M260 696v14m400-14v14" stroke="#91a4bb" stroke-width="1.5"/>
    <text x="460" y="723" text-anchor="middle" class="muted" font-size="11">目标总宽约 160 mm（含轮胎；按实物复核）</text>
    <path d="M170 95V660" stroke="#91a4bb" stroke-width="1.5"/>
    <path d="M163 95h14m-14 565h14" stroke="#91a4bb" stroke-width="1.5"/>
    <text x="141" y="378" text-anchor="middle" class="muted" font-size="11" transform="rotate(-90 141 378)">目标总长约 220 mm</text>
  </g>

  <!-- 右侧说明和装配顺序 -->
  <g transform="translate(922 112)">
    <text x="0" y="0" class="white" font-size="18" font-weight="800">装配原则</text>
    <g transform="translate(0 27)">
      <circle cx="13" cy="13" r="13" fill="#63e6be"/><text x="13" y="18" text-anchor="middle" fill="#08231d" font-size="12" font-weight="900">1</text>
      <text x="38" y="18" class="white small">先装电机、轮子和万向轮</text>
    </g>
    <g transform="translate(0 67)">
      <circle cx="13" cy="13" r="13" fill="#ff7777"/><text x="13" y="18" text-anchor="middle" fill="#371010" font-size="12" font-weight="900">2</text>
      <text x="38" y="18" class="white small">电池低位居中，固定防松</text>
    </g>
    <g transform="translate(0 107)">
      <circle cx="13" cy="13" r="13" fill="#ffc857"/><text x="13" y="18" text-anchor="middle" fill="#302106" font-size="12" font-weight="900">3</text>
      <text x="38" y="18" class="white small">主控与驱动靠近电机和电池</text>
    </g>
    <g transform="translate(0 147)">
      <circle cx="13" cy="13" r="13" fill="#66d9ef"/><text x="13" y="18" text-anchor="middle" fill="#06202a" font-size="12" font-weight="900">4</text>
      <text x="38" y="18" class="white small">相机、ToF、线阵列保持前视</text>
    </g>
    <rect x="0" y="205" width="236" height="150" rx="13" fill="#17283b" stroke="#405671"/>
    <text x="17" y="234" fill="#8ce3c5" font-size="13" font-weight="800">关键净空</text>
    <text x="17" y="260" class="white small">• 线阵列初装先试 5–10 mm</text>
    <text x="17" y="284" class="white small">• 镜头前方不被支架遮挡</text>
    <text x="17" y="308" class="white small">• 轮胎外沿计入车宽</text>
    <text x="17" y="332" class="white small">• 电池可拆换且不会滑动</text>
    <rect x="0" y="377" width="236" height="102" rx="13" fill="#302a20" stroke="#8b6a35"/>
    <text x="17" y="406" fill="#ffd16d" font-size="13" font-weight="800">说明</text>
    <text x="17" y="431" class="white small">模块比例为示意图，不是</text>
    <text x="17" y="453" class="white small">最终 CAD 或加工尺寸。</text>
  </g>
</svg>
