<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">循迹小车视觉识别界面概念图</title>
  <desc id="desc">白色赛道上显示黑色曲线、绿色路线高亮、青色车宽安全边界，以及被检测到的障碍物边界框。右侧显示相机、ToF和安全判断说明。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101b2b"/><stop offset="1" stop-color="#17263a"/></linearGradient>
    <linearGradient id="field" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#e9eff3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#07101c" flood-opacity=".28"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#bed0d8" stroke-opacity=".36" stroke-width="1"/></pattern>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .white{fill:#f1f6ff}.muted{fill:#9eafc5}.dark{fill:#27384a}.small{font-size:13px}.label{font-size:15px;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="718" rx="23" fill="none" stroke="#5c7593" stroke-opacity=".34"/>
  <circle cx="34" cy="36" r="6" fill="#ff7777"/><circle cx="56" cy="36" r="6" fill="#ffc857"/><circle cx="78" cy="36" r="6" fill="#63e6be"/>
  <text x="104" y="42" class="white label">MaixCAM2 · OS04D10 · 视觉识别示意</text>
  <text x="1165" y="42" text-anchor="end" class="muted small">概念画面 / 示意数据</text>

  <g filter="url(#shadow)">
    <rect x="24" y="72" width="828" height="620" rx="16" fill="url(#field)"/>
    <rect x="24" y="72" width="828" height="620" rx="16" fill="url(#grid)" opacity=".5"/>
  </g>
  <text x="46" y="103" class="dark small" font-weight="700">前向相机画面 · 赛道与障碍物几何识别</text>

  <!-- 浅青色通道表示按车体宽度和安全余量扩出的可行驶边界 -->
  <path d="M450 670 C450 594 464 535 406 480 C347 423 289 395 330 331 C369 268 465 266 552 292 C648 321 738 303 800 229" fill="none" stroke="#67d9ef" stroke-opacity=".19" stroke-width="126" stroke-linecap="round"/>
  <path d="M391 668 C392 594 405 541 348 493 C290 444 253 394 291 316 C326 245 437 237 536 267 C636 297 742 279 816 210" fill="none" stroke="#139bb6" stroke-width="4" stroke-dasharray="12 10" stroke-linecap="round"/>
  <path d="M509 670 C508 594 523 519 465 467 C408 414 326 394 369 347 C407 301 492 296 568 318 C660 344 721 328 783 250" fill="none" stroke="#139bb6" stroke-width="4" stroke-dasharray="12 10" stroke-linecap="round"/>

  <!-- 黑色实际循迹线与绿色识别中心线 -->
  <path d="M450 670 C450 594 464 535 406 480 C347 423 289 395 330 331 C369 268 465 266 552 292 C648 321 738 303 800 229" fill="none" stroke="#15191f" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M450 670 C450 594 464 535 406 480 C347 423 289 395 330 331 C369 268 465 266 552 292 C648 321 738 303 800 229" fill="none" stroke="#63e6be" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="13 10"/>

  <!-- 障碍物目标框 -->
  <g>
    <path d="M575 449l24-35 33 4 18 34-18 29-44-3z" fill="#d48d62" stroke="#8c4e30" stroke-width="3"/>
    <rect x="562" y="400" width="105" height="100" rx="8" fill="none" stroke="#ff7777" stroke-width="4"/>
    <rect x="562" y="375" width="174" height="24" rx="6" fill="#c34252"/>
    <text x="572" y="392" fill="#fff" font-size="12" font-weight="700">障碍物 A · 目标框</text>
  </g>
  <g>
    <rect x="222" y="268" width="58" height="67" rx="9" fill="#e0b84d" stroke="#987729" stroke-width="3"/>
    <rect x="211" y="254" width="80" height="94" rx="8" fill="none" stroke="#ff7777" stroke-width="4"/>
    <rect x="211" y="230" width="145" height="23" rx="6" fill="#c34252"/>
    <text x="221" y="246" fill="#fff" font-size="12" font-weight="700">障碍物 B · 侧向</text>
  </g>

  <!-- 标注线宽和安全余量 -->
  <g>
    <path d="M448 571H548" stroke="#087f96" stroke-width="2"/>
    <path d="M448 559v24M548 559v24" stroke="#087f96" stroke-width="3"/>
    <rect x="459" y="541" width="144" height="25" rx="7" fill="#e8fbff" stroke="#7bcddd"/>
    <text x="531" y="558" text-anchor="middle" class="dark small" font-weight="700">车宽 + 避障余量</text>
  </g>
  <rect x="43" y="631" width="251" height="39" rx="10" fill="#102033" fill-opacity=".88"/>
  <circle cx="60" cy="650" r="5" fill="#63e6be"/><text x="72" y="655" class="white small">识别路线中心</text>
  <path d="M177 650h24" stroke="#139bb6" stroke-width="3" stroke-dasharray="5 4"/><text x="208" y="655" class="white small">车体边界</text>

  <!-- 右侧说明区 -->
  <g filter="url(#shadow)"><rect x="872" y="72" width="304" height="620" rx="16" fill="#111d2e" stroke="#31445d"/></g>
  <text x="898" y="111" class="white" font-size="19" font-weight="800">感知结果</text>
  <text x="898" y="137" class="muted small">视觉负责识别形状和相对位置</text>
  <rect x="894" y="159" width="260" height="70" rx="11" fill="#172940" stroke="#304761"/>
  <text x="910" y="184" class="muted small">相机配置</text><text x="910" y="208" class="white label">2K · OS04D10</text>
  <rect x="894" y="244" width="260" height="70" rx="11" fill="#172940" stroke="#304761"/>
  <text x="910" y="269" class="muted small">障碍物测距</text><text x="910" y="293" class="white label">SEN0628 · 8×8 ToF</text>
  <text x="898" y="350" fill="#63e6be" class="small" font-weight="700">判断步骤</text>
  <circle cx="906" cy="378" r="11" fill="#63e6be"/><text x="906" y="383" text-anchor="middle" fill="#08231d" font-size="12" font-weight="900">1</text>
  <text x="928" y="383" class="white small">提取黑线并高亮路线</text>
  <circle cx="906" cy="414" r="11" fill="#4bc3dc"/><text x="906" y="419" text-anchor="middle" fill="#06202a" font-size="12" font-weight="900">2</text>
  <text x="928" y="419" class="white small">按轮距扩出两侧边界</text>
  <circle cx="906" cy="450" r="11" fill="#ff7777"/><text x="906" y="455" text-anchor="middle" fill="#371010" font-size="12" font-weight="900">3</text>
  <text x="928" y="455" class="white small">检查障碍框是否侵入通道</text>
  <rect x="894" y="486" width="260" height="94" rx="11" fill="#302a20" stroke="#8b6a35"/>
  <text x="910" y="512" fill="#ffd16d" class="small" font-weight="800">低置信度时</text>
  <text x="910" y="538" class="white small">先减速；若车宽边界与障碍物</text>
  <text x="910" y="558" class="white small">相交，优先选择安全绕行方向。</text>
  <text x="898" y="626" class="muted small">示意画面，不代表实时识别截图</text>
</svg>
