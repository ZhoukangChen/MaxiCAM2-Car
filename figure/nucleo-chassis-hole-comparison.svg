<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2520" height="1660" viewBox="0 0 2520 1660">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#263449" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e58a00"/>
    </marker>
  </defs>
  <rect width="2520" height="1660" fill="#eef3f8"/>
  <text x="72" y="82" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="42" font-weight="700" fill="#162437">底盘与 NUCLEO-F446RE 固定孔位对照</text>
  <text x="74" y="124" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" fill="#536579">橙色 A / B：底盘图上的候选孔　　蓝色 1 / 2：NUCLEO 板上的安装孔</text>

  <rect x="56" y="158" width="1518" height="1164" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="1590" y="158" width="874" height="1164" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="88" y="207" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#23364d">底盘上层板俯视图</text>
  <text x="1622" y="207" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#23364d">NUCLEO 机械尺寸图</text>
  <text x="88" y="235" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#718096">按商品图标注的 228 × 148 mm 比例，圈出前面估出的那组孔</text>
  <text x="1622" y="235" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#718096">按 ST UM1724 机械图，标出板上两只固定孔</text>

  <image x="82" y="252" width="1460" height="1006" preserveAspectRatio="none" xlink:href="references/chassis-top-plate-drawing-20261118.png"/>
  <!-- 底盘候选孔坐标：原图像素约 (217,398) 与 (474,396)，来自截图比例估测 -->
  <line x1="292.4" y1="637.7" x2="541.5" y2="635.8" stroke="#e58a00" stroke-width="5" stroke-dasharray="12 10" opacity="0.82" marker-start="url(#arrowOrange)" marker-end="url(#arrowOrange)"/>
  <circle cx="292.4" cy="637.7" r="24" fill="#ffb21c" fill-opacity="0.14" stroke="#e58a00" stroke-width="8"/>
  <circle cx="541.5" cy="635.8" r="24" fill="#ffb21c" fill-opacity="0.14" stroke="#e58a00" stroke-width="8"/>
  <circle cx="292.4" cy="637.7" r="5" fill="#e58a00"/>
  <circle cx="541.5" cy="635.8" r="5" fill="#e58a00"/>
  <rect x="250" y="583" width="52" height="38" rx="12" fill="#e58a00"/>
  <text x="276" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">A</text>
  <rect x="552" y="583" width="52" height="38" rx="12" fill="#e58a00"/>
  <text x="578" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">B</text>
  <rect x="342" y="654" width="172" height="42" rx="14" fill="#fff7e7" stroke="#e58a00" stroke-width="2"/>
  <text x="428" y="683" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#9a5b00">约 48 mm</text>

  <image x="1678" y="252" width="696" height="783" preserveAspectRatio="none" xlink:href="references/nucleo-f446re-mechanical-dimensions.jpg"/>
  <!-- NUCLEO 图中安装孔中心约为原图 (185,460) 与 (529,430) -->
  <line x1="1874.3" y1="739.8" x2="2239.2" y2="707.9" stroke="#087fc4" stroke-width="5" stroke-dasharray="10 9" opacity="0.82"/>
  <circle cx="1874.3" cy="739.8" r="20" fill="#18a7ef" fill-opacity="0.13" stroke="#087fc4" stroke-width="8"/>
  <circle cx="2239.2" cy="707.9" r="20" fill="#18a7ef" fill-opacity="0.13" stroke="#087fc4" stroke-width="8"/>
  <circle cx="1874.3" cy="739.8" r="5" fill="#087fc4"/>
  <circle cx="2239.2" cy="707.9" r="5" fill="#087fc4"/>
  <rect x="1812" y="765" width="52" height="38" rx="12" fill="#087fc4"/>
  <text x="1838" y="792" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">1</text>
  <rect x="2250" y="664" width="52" height="38" rx="12" fill="#087fc4"/>
  <text x="2276" y="691" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">2</text>

  <rect x="1640" y="1062" width="774" height="190" rx="18" fill="#edf8ff" stroke="#b8e4fa" stroke-width="2"/>
  <text x="1672" y="1112" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#075b8e">NUCLEO 两孔特征</text>
  <text x="1672" y="1157" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" fill="#25445e">孔中心距：约 48.26 mm</text>
  <text x="1672" y="1198" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" fill="#25445e">两孔前后错位：约 4.83 mm</text>
  <text x="1672" y="1232" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" fill="#567187">1、2 为板上实际安装孔，不是排针孔。</text>

  <rect x="56" y="1350" width="2408" height="238" rx="24" fill="#162437"/>
  <circle cx="96" cy="1411" r="8" fill="#ffae1a"/>
  <text x="120" y="1419" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#ffffff">请这样对比</text>
  <text x="120" y="1465" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" fill="#d5e1ee">底盘 A / B 是从截图和 228 × 148 mm 外形比例估出的候选孔，图上看起来几乎同高；不是已确认的加工孔位。</text>
  <text x="120" y="1507" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" fill="#d5e1ee">把 NUCLEO 实物按方向放在底盘上，检查 1 / 2 是否同时落在 A / B 或长槽内。若只对上一个，先别钻孔。</text>
  <text x="120" y="1551" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#9fb2c8">NUCLEO 尺寸依据：ST UM1724 Figure 5；两孔纵向错位由 ST 技术人员答复核算。底盘 A / B 为图像估测，最终以实物叠放或 CAD 尺寸为准。</text>
</svg>
