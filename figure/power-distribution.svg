<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">循迹小车台架供电实测与模块连接状态</title>
  <desc id="desc">2026年11月21日记录：3S电池实测12.67伏输入YB-MVP01，VADJ实测10.37伏供AT8236并完成左右电机短点动。NUCLEO由Mini-USB供电，循线板从NUCLEO 5伏取电，MaixCAM2用内置电池。固定5伏和3.3伏输出已测电压但带载能力未验证。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a29"/><stop offset="1" stop-color="#1c2d43"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#030812" flood-opacity=".28"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .title{fill:#f1f6ff;font-size:27px;font-weight:850}.subtitle{fill:#a9bad0;font-size:15px}
      .head{font-size:19px;font-weight:800}.body{font-size:15px}.small{font-size:13px}.tiny{font-size:12px}
      .white{fill:#eff5ff}.muted{fill:#a6b7cc}.amber{fill:#ffdc8c}.cyan{fill:#b8f2ff}.green{fill:#a9f4d7}.red{fill:#ffaaaa}
      .box{fill:#18293d;stroke:#506783;stroke-width:1.5}.good{fill:#172e32;stroke:#63e6be;stroke-width:2}.warnbox{fill:#30252c;stroke:#f27878;stroke-width:2}
      .line-good{fill:none;stroke:#63e6be;stroke-width:4;stroke-linecap:round}.line-pending{fill:none;stroke:#ffc857;stroke-width:3;stroke-dasharray:9 8;stroke-linecap:round}
    </style>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63e6be"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc857"/></marker>
  </defs>
  <rect width="1280" height="900" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="898" rx="23" fill="none" stroke="#5c7593" stroke-opacity=".38"/>
  <text x="38" y="48" class="title">台架供电实测 · 2026-11-21</text>
  <text x="38" y="77" class="subtitle">绿色：已测通的路径　　黄色虚线：复接后待复测 / 负载能力待核　　红框：不可直连</text>

  <g filter="url(#shadow)">
    <rect x="40" y="116" width="300" height="205" rx="16" class="box"/>
    <rect x="390" y="116" width="375" height="205" rx="16" class="good"/>
    <rect x="815" y="116" width="425" height="205" rx="16" class="warnbox"/>
    <rect x="40" y="385" width="360" height="190" rx="16" class="box"/>
    <rect x="430" y="385" width="350" height="190" rx="16" class="box"/>
    <rect x="810" y="385" width="430" height="190" rx="16" class="box"/>
    <rect x="40" y="630" width="1200" height="218" rx="18" class="box"/>
  </g>

  <text x="64" y="153" class="head white">3S 6000mAh 电池</text>
  <text x="64" y="188" class="body white">标签：11.1V 标称 / 12.6V 最高</text>
  <text x="64" y="220" class="body green">万用表实测：12.67V</text>
  <text x="64" y="263" class="small muted">单个 T 型输出口 → 稳压板输入</text>
  <text x="64" y="291" class="small amber">禁止将电池直接接 AT8236 VM</text>

  <text x="414" y="153" class="head green">YB-MVP01-V1.0 降压板</text>
  <text x="414" y="185" class="small white">输入：DC6–24V · 接入 3S 电池</text>
  <text x="414" y="224" class="body white">VADJ：10.37V → AT8236 VM</text>
  <text x="414" y="256" class="small cyan">固定 5V：5.13V（带载能力未测）</text>
  <text x="414" y="284" class="small" fill="#d3d4ff">固定 3.3V：3.34V（带载能力未测）</text>

  <text x="839" y="153" class="head red">AT8236 双路驱动 · 按 5–12V 上限</text>
  <text x="839" y="187" class="body white">VM 输入端实测：10.37V</text>
  <text x="839" y="220" class="body green">MOTOR-A / MOTOR-B 短点动通过</text>
  <text x="839" y="257" class="small red">板上及官方页标注 5–12V</text>
  <text x="839" y="284" class="small muted">资料表另写 5–17V；冲突未澄清前按 12V</text>

  <path d="M340 212H379" class="line-good" marker-end="url(#arrowGreen)"/>
  <path d="M765 212H804" class="line-good" marker-end="url(#arrowGreen)"/>
  <text x="360" y="194" text-anchor="middle" class="tiny green">12.67V</text>
  <text x="785" y="194" text-anchor="middle" class="tiny green">10.37V</text>

  <text x="64" y="425" class="head white">NUCLEO-F446RE</text>
  <text x="64" y="459" class="body green">当前由 ST-LINK Mini-USB 供电</text>
  <text x="64" y="492" class="small white">外部 VIN 未接；避免双路供电</text>
  <text x="64" y="531" class="small muted">电机测试固件：上电先拉低四路输入</text>

  <text x="454" y="425" class="head cyan">YB-MUX04-2.0 循线板</text>
  <text x="454" y="459" class="body white">5V / GND 由 NUCLEO 供电</text>
  <text x="454" y="492" class="small muted">SCL→D15/PB8 · SDA→D14/PB9</text>
  <text x="454" y="531" class="small amber">I²C 旧测试通过；本次复接待复测</text>

  <text x="834" y="425" class="head white">MaixCAM2</text>
  <text x="834" y="459" class="body white">内置电池供电；USB-C 接电脑 / 充电</text>
  <text x="834" y="492" class="small muted">U2T↔PA10 · U2R↔PA9 · GND 共地</text>
  <text x="834" y="531" class="small amber">旧 UART 测试通过；本次复接待复测</text>

  <text x="66" y="674" class="head white">本次里程碑</text>
  <text x="66" y="710" class="body green">车轮架空：左右轮各点动 200ms，最终均向车头方向前进</text>
  <text x="66" y="746" class="body white">右轮 MOTOR-A：软件由 AIN2 驱动　｜　左轮 MOTOR-B：BIN1 驱动</text>
  <text x="66" y="779" class="small muted">当前程序只做 ARM 门控的短脉冲，不是循迹 / 视觉 / 闭环运行固件。</text>
  <text x="66" y="818" class="small amber">YB-MPP01-V2.0 已安装但未纳入本次供电路径；调压板持续电流、温升、保险丝与负载能力仍待核验。</text>
</svg>
